version: 1
# Protein with a CCD ligand biased into a known pocket on chain A.
# Boltz-1 only supports max_distance=6 and a single pocket constraint;
# Boltz-2 (default) supports 4–20 Å and multiple pocket entries.
#   boltz predict pocket.yaml --use_msa_server
sequences:
  - protein:
      id: [A1]
      sequence: 
  - ligand:
      ccd: EKY
      id: [B1]
constraints:
  - pocket:
      binder: B1
      contacts: [[A1, 829], [A1, 138]]
      max_distance: 6     # Boltz-2 allows 4–20; Boltz-1 must be 6
      force: false        # set true to enforce via a potential during diffusion
