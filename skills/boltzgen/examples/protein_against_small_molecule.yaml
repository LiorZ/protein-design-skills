# Protein binder against a small molecule (SMILES).
# Affinity prediction is automatic under the protein-small_molecule protocol.
# (Modeled on example/protein_binding_small_molecule/brilacidin.yaml)
#
# Run:
#   boltzgen check examples/protein_against_small_molecule.yaml
#   boltzgen run   examples/protein_against_small_molecule.yaml \
#     --output workbench/test --protocol protein-small_molecule --num_designs 200

entities:
  # Designed protein, length 140-180.
  - protein:
      id: A
      sequence: 140..180

  # Target ligand (small molecule) as a SMILES string.
  # Hard cap: 128 heavy atoms; training cap: 56 (larger → unreliable affinity).
  - ligand:
      id: B
      smiles: "C1CNC[C@@H]1OC2=C(C=C(C=C2NC(=O)C3=CC(=NC=N3)C(=O)NC4=CC(=CC(=C4O[C@@H]5CCNC5)NC(=O)CCCCN=C(N)N)C(F)(F)F)C(F)(F)F)NC(=O)CCCCN=C(N)N"
