# Kitchen-sink design spec — demonstrates every feature of the YAML schema.
# Verbatim from example/design_spec_showcasing_all_functionalities.yaml plus
# inline comments.
#
# This file is NOT meant to be run as-is (its constraints are illustrative).
# It's a reference for "how do I write X?" — read it as documentation.

entities:
  # 1. Designed protein with per-position residue constraints.
  - protein:
      id: G
      # 15..20 random design residues, then 6 fixed (AAAAAA), then 4 fixed
      # (VTTTT — wait, V T T T T is 5; the original sequence has 4: VTTT),
      # then 18 random design residues, then PPP fixed.
      sequence: 15..20AAAAAAVTTTT18PPP
      residue_constraints:
        - position: 1
          allowed: A          # whitelist
        - position: 3..5
          disallowed: CM       # blacklist
        - position: 8
          allowed: AGS

  # 2. Designed peptide with two Cys for staple.
  - protein:
      id: R
      sequence: 3..5C6C3

  # 3. Small-molecule staple (WHL by CCD code).
  - ligand:
      id: Q
      ccd: WHL

  # 4. Designed peptide with explicit (empty) secondary_structure key
  # (no SS specified -> defaults).
  - protein:
      id: H
      sequence: 17
      secondary_structure:

  # 5. Target imported from a CIF file with many features.
  - file:
      path: 7rpz.cif
      include:
        - chain: {id: A}
        - chain: {id: B}

      # Crop to residues within 35 Å of chain A residues 10-16.
      include_proximity:
        - chain:
            id: A
            res_index: 10..16
            radius: 35

      # Bind A:5..7,13; do NOT bind anywhere on chain B.
      binding_types:
        - chain: {id: A, binding: 5..7,13}
        - chain: {id: B, not_binding: "all"}

      # Show structure of A:10..16 fully; show B in an independent group;
      # hide A:13 specifically (later entries override earlier ones).
      structure_groups:
        - group: {visibility: 1, id: A, res_index: 10..16}
        - group: {visibility: 2, id: B}
        - group: {visibility: 0, id: A, res_index: 13}

      # Redesign A:..4,20..27.
      design:
        - chain: {id: A, res_index: ..4,20..27}

      # Secondary-structure conditioning on redesigned residues.
      secondary_structure:
        - chain:
            id: A
            loop: 1
            helix: 2..3
            sheet: 4

      # Insert 2-9 designed residues after A:20, with helical SS.
      design_insertions:
        - insertion:
            id: A
            res_index: 20
            num_residues: 2..9
            secondary_structure: HELIX

  # 6. Fixed-sequence chain with string-form binding_types.
  - protein:
      id: A
      sequence: AAAAAAAAAAAAAAAAAAAAAAAA
      binding_types: uuuuBBBuNNNuBuu   # B=bind, N=no-bind, u=unspecified

  # 7. Fuse — chain A from this file is appended onto the protein A above.
  - file:
      path: 7rpz.cif
      fuse: A
      include:
        - chain: {id: A, res_index: ..5}

  # 8. Dict-form binding_types on a fully fixed sequence.
  - protein:
      id: B
      sequence: AAAAAAAAAAAAAAAAAAAAAAAA
      binding_types:
        binding: 5..7,13
        not_binding: 9..11

  # 9. Two cloned ligands by passing a list of IDs.
  - ligand:
      id: [C, D]
      ccd: SAH

  # 10. Two cloned SMILES ligands, both marked as binding.
  - ligand:
      id: [E, F]
      smiles: 'N[C@@H](Cc1ccc(O)cc1)C(=O)O'
      binding_types: B

  # 11. Include all of a file but exclude a few residues; structure_groups
  # show all by default, then hide chain A:10..16.
  - file:
      path: 7rpz.cif
      include: "all"
      exclude:
        - chain: {id: A, res_index: ..5}
      structure_groups:
        - group: {visibility: 1, id: "all"}
        - group: {visibility: 0, id: A, res_index: 10..16}

  # 12. Another file with binding_types + structure_groups +
  # design + secondary_structure all on chain A.
  - file:
      path: 8r3a.cif
      include:
        - chain: {id: A}
        - chain: {id: B}
      binding_types:
        - chain: {id: A, binding: 5..7,13}
        - chain: {id: B, not_binding: "all"}
      structure_groups:
        - group: {visibility: 1, id: A, res_index: 10..13}
        - group: {visibility: 2, id: B}
        - group: {visibility: 0, id: A, res_index: 13}
      design:
        - chain: {id: A, res_index: 14..19}
      secondary_structure:
        - chain:
            id: A
            loop: 14
            helix: 15..17
            sheet: 19

  # 13. Disulfide peptide (linear).
  - protein:
      id: S
      sequence: 10C6C3

  # 14. Cyclic peptide with two cysteines for a disulfide bond.
  - protein:
      id: T
      sequence: C10C6C3C
      cyclic: true

constraints:
  # Note: residue indices are counted "as if the minimum length was sampled".
  - bond: {atom1: [R, 4,  SG], atom2: [Q, 1, CK]}   # staple WHL/CK to peptide R Cys-4
  - bond: {atom1: [R, 11, SG], atom2: [Q, 1, CH]}   # second staple bond
  - bond: {atom1: [S, 11, SG], atom2: [S, 18, SG]}  # disulfide on peptide S
  - bond: {atom1: [T, 12, SG], atom2: [T, 19, SG]}  # disulfide on cyclic peptide T

  # Total-length constraint across the whole designed system.
  - total_len:
      min: 10
      max: 20
