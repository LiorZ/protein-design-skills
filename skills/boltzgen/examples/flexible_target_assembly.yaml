# Bind a target whose biological assembly is a multimer, with a flexible
# loop on each subunit hidden so the model can re-position it.
# (Modeled on example/streptavidin_partially_flexible_target/linear_against_full_assembly.yaml)
#
# `use_assembly: true` instantiates the biological assembly. Chains are
# suffixed with their copy number (A1, B1, A2, B2 ...).
#
# Run:
#   boltzgen check examples/flexible_target_assembly.yaml
#   boltzgen run   examples/flexible_target_assembly.yaml \
#     --output workbench/test --protocol peptide-anything --num_designs 100

entities:
  - protein:
      id: C
      sequence: 8..18    # designed linear peptide

  - file:
      path: target.cif         # <-- replace with your CIF
      use_assembly: true       # build the biological assembly (A→A1,A2; B→B1,B2)
      include:
        - chain: {id: A1}
        - chain: {id: B1}
        - chain: {id: A2}
        - chain: {id: B2}

      # Show all chains, but hide the flexible 32-42 loop on each.
      structure_groups:
        - group: {id: A1, visibility: 1}
        - group: {id: B1, visibility: 1}
        - group: {id: A1, visibility: 0, res_index: 32..42}
        - group: {id: B1, visibility: 0, res_index: 32..42}
        - group: {id: A2, visibility: 1}
        - group: {id: B2, visibility: 1}
        - group: {id: A2, visibility: 0, res_index: 32..42}
        - group: {id: B2, visibility: 0, res_index: 32..42}
