# A single Fab scaffold YAML — modeled on example/fab_scaffolds/adalimumab.6cr1.yaml.
#
# Both heavy (B) and light (A) chains are imported, their CDR regions are
# redesigned with variable-length insertions, and residue numbering is reset.

path: scaffold.cif             # <-- replace with your Fab CIF

include:
  - chain:
      id: B                     # heavy chain
      res_index: 1..121
  - chain:
      id: A                     # light chain
      res_index: 1..107

# Heavy: CDR-H1 26-32, CDR-H2 52-57, CDR-H3 99-110.
# Light: CDR-L1 24-34, CDR-L2 50-56, CDR-L3 89-97.
design:
  - chain: {id: B, res_index: 26..32,52..57,99..110}
  - chain: {id: A, res_index: 24..34,50..56,89..97}

structure_groups:
  - group: {id: B, visibility: 2}
  - group: {id: A, visibility: 2}
  - group: {id: B, res_index: 26..32,52..57,99..110, visibility: 0}
  - group: {id: A, res_index: 24..34,50..56,89..97, visibility: 0}

exclude:
  - chain: {id: B, res_index: 26..32}
  - chain: {id: B, res_index: 52..57}
  - chain: {id: B, res_index: 99..110}
  - chain: {id: A, res_index: 24..34}
  - chain: {id: A, res_index: 50..56}
  - chain: {id: A, res_index: 89..97}

design_insertions:
  - insertion: {id: B, res_index: 26, num_residues: 7..9}
  - insertion: {id: B, res_index: 52, num_residues: 5..8}
  - insertion: {id: B, res_index: 99, num_residues: 3..21}
  - insertion: {id: A, res_index: 24, num_residues: 10..17}
  - insertion: {id: A, res_index: 50, num_residues: 7}
  - insertion: {id: A, res_index: 89, num_residues: 8..12}

reset_res_index:
  - chain: {id: B}
  - chain: {id: A}
